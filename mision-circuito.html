<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geoeconomía: Misión Circuito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14284b; --ink2:#2b3d63; --mut:#5c6a85; --line:#d9e1ec;
  --paper:#eef2f6; --card:#ffffff;
  --azul:#2d6cdf; --azul-l:#e3ecfc;
  --verde:#1a9e74; --verde-l:#ddf4eb;
  --lila:#8a6ee8; --lila-l:#eee9fd;
  --amar:#ffd36b; --amar-l:#fff5d9;
  --rojo:#d9534f; --rojo-l:#fce8e7;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.55;color:var(--ink);background:var(--paper);
  background-image:radial-gradient(circle at 1px 1px,#d5deea 1px,transparent 0);background-size:22px 22px;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lila);outline-offset:2px}
h1,h2,h3{line-height:1.15;margin:0 0 .4em;font-stretch:112%}
h2{font-size:clamp(1.35rem,3.4vw,1.85rem);font-weight:800}
h3{font-size:1.08rem;font-weight:750}
p{margin:.3em 0 .8em}
.small{font-size:.86rem}.muted{color:var(--mut)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* Barra superior */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 0 #0b1a36}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1040px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-stretch:118%;cursor:pointer;background:none;border:0;color:#fff;padding:0}
.brand span{font-size:1.4rem}
.clues{margin-left:auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;font-size:.88rem;white-space:nowrap}
.track{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;max-width:1040px;margin:0 auto;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.tk{flex:0 0 auto;border:1px solid rgba(255,255,255,.22);background:transparent;color:#c8d3ea;border-radius:10px;padding:5px 10px;font-size:.78rem;line-height:1.2;text-align:left;cursor:pointer}
.tk b{display:block;font-size:.84rem;color:#fff}
.tk.done{background:var(--verde);border-color:var(--verde);color:#eafff6}
.tk.cur{background:var(--amar);border-color:var(--amar);color:var(--ink)}.tk.cur b{color:var(--ink)}
.tk.lock{opacity:.45;cursor:not-allowed}

/* Hero */
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hero svg.topo{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero-in{position:relative;max-width:1040px;margin:0 auto;padding:46px 16px 54px;display:grid;gap:26px}
.hero h1{font-size:clamp(2.3rem,8vw,4.6rem);font-weight:800;font-stretch:125%;letter-spacing:-.01em;margin:0}
.hero h1 small{display:block;font-size:.42em;font-weight:600;font-stretch:100%;color:var(--amar);letter-spacing:.02em;margin-bottom:6px}
.hero .q{font-size:clamp(1.15rem,3vw,1.5rem);color:#d9e4ff;max-width:34ch;margin:8px 0 0}
.hero .lead{max-width:58ch;color:#c3cfea}
.route-path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3.2s ease-out .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.route-path{animation:none;stroke-dashoffset:0}*{scroll-behavior:auto!important}}

/* Botones */
.btn{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:44px;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.go{background:var(--amar);border-color:var(--amar);color:var(--ink);font-size:1.08rem;padding:13px 24px}
.btn.green{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.ghost{border-color:var(--line);background:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}

/* Contenedores */
main{padding:22px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:0 0 16px}
.card.case{border-left:6px solid var(--lila)}
.mhead{display:flex;gap:14px;align-items:flex-start;margin:6px 0 18px}
.mhead .ic{font-size:2rem;width:56px;height:56px;flex:0 0 56px;display:grid;place-items:center;background:#fff;border:2px solid var(--ink);border-radius:16px}
.mhead .num{font-size:.85rem;font-weight:700;color:var(--azul)}
.step{border-top:2px dashed var(--line);padding-top:16px;margin-top:18px}
.step-t{display:flex;align-items:center;gap:8px;font-weight:750;margin-bottom:6px}
.step-t i{font-style:normal;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;font-size:.8rem}
.concept{background:var(--amar-l);border:1px solid #f1dc9c;border-radius:14px;padding:14px 16px;margin:12px 0}
.concept b:first-child{display:block;margin-bottom:2px}
.sim{display:inline-block;background:var(--lila);color:#fff;font-weight:800;font-size:.75rem;letter-spacing:.04em;padding:3px 9px;border-radius:6px}
.real{background:var(--verde-l);border:1px solid #b8e5d3;border-radius:12px;padding:10px 14px;font-size:.92rem;margin:10px 0}
details.src{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
details.src summary{cursor:pointer;font-weight:700}
details.src li{margin:4px 0}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
.grid3{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}}

/* Formularios */
label.q{display:block;font-weight:650;margin:12px 0 4px}
textarea,input[type=text],select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfcfe;min-height:44px}
textarea{min-height:76px;resize:vertical}
textarea:focus,select:focus,input:focus{border-color:var(--azul);outline:none;background:#fff}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;cursor:pointer;text-align:left;min-height:44px;line-height:1.3}
.pill:hover{border-color:var(--azul)}
.pill.sel{border-color:var(--azul);background:var(--azul-l);font-weight:650}
.pill.ok{border-color:var(--verde);background:var(--verde-l)}
.pill.bad{border-color:var(--rojo);background:var(--rojo-l)}
.pills.col{flex-direction:column}.pills.col .pill{width:100%}

/* Retroalimentación */
.fb{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:.95rem;border:1px solid}
.fb.ok{background:var(--verde-l);border-color:#a9dfc9}
.fb.bad{background:var(--rojo-l);border-color:#f2b9b6}
.fb.info{background:var(--azul-l);border-color:#bcd0f6}
.fb ul{margin:6px 0 0;padding-left:18px}.fb li{margin:5px 0}
.okl{color:#0f5e45}.badl{color:#8e2a26}

/* Clasificador */
.pool{min-height:64px;border:2px dashed #b8c5da;border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;background:#f7f9fc;margin:8px 0}
.bins{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.bins.b2{grid-template-columns:1fr 1fr}.bins.b5{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.bins.b5{grid-template-columns:repeat(5,1fr)}}
.bin{border:2px solid var(--line);border-radius:14px;background:#fff;min-height:96px;padding:8px;cursor:pointer;transition:border-color .15s,background .15s}
.bin.armed{border-color:var(--azul);background:#f4f8ff}
.bin.over{border-color:var(--lila);background:var(--lila-l)}
.bin-h{font-weight:800;font-size:.92rem;margin-bottom:6px}
.bin-body{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--ink2);background:#fff;border-radius:10px;padding:7px 10px;font-size:.88rem;cursor:grab;text-align:left;line-height:1.25;min-height:40px;touch-action:manipulation}
.chip.sel{background:var(--ink);color:#fff}
.chip.ok{border-color:var(--verde);background:var(--verde-l);color:#0f5e45}
.chip.bad{border-color:var(--rojo);background:var(--rojo-l);color:#8e2a26}
.hint-line{font-size:.88rem;color:var(--mut);margin:4px 0}

/* Productos */
.prods{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:620px){.prods{grid-template-columns:repeat(4,1fr)}}
.prod{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 10px;cursor:pointer;text-align:center;font-weight:700}
.prod .e{font-size:2.3rem;display:block}
.prod small{display:block;font-weight:500;color:var(--mut);font-size:.78rem}
.prod:hover,.prod.sel{border-color:var(--azul);background:var(--azul-l)}
.dossier{display:flex;gap:16px;align-items:center;background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:16px;position:relative;overflow:hidden}
.dossier .e{font-size:3rem}
.dossier .tag{font-size:.8rem;color:var(--amar);font-weight:700}
.dossier h3{font-size:1.4rem;margin:0}

/* Territorios */
.terr{border:2px solid var(--line);border-radius:16px;padding:14px;background:#fff;cursor:pointer;text-align:left;width:100%}
.terr.sel{border-color:var(--verde);background:#f3fbf7}
.terr h3{display:flex;gap:6px;align-items:center}
.terr dl{margin:0;font-size:.88rem;display:grid;grid-template-columns:auto 1fr;gap:3px 8px}
.terr dt{font-weight:700;color:var(--ink2)}.terr dd{margin:0;color:var(--mut)}

/* Agentes */
.agents{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.agents{grid-template-columns:repeat(3,1fr)}}
.agent{background:var(--lila-l);border-radius:12px;padding:9px 11px;font-size:.88rem}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.9rem;margin-top:8px}
.chain span{background:#fff;border:1.5px solid var(--verde);border-radius:10px;padding:5px 9px}
.chain em{font-style:normal;color:var(--verde);font-weight:800}

/* Circuito */
.route{display:flex;flex-direction:column;gap:6px;margin:8px 0;counter-reset:st}
.slot{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:8px 10px;cursor:pointer;text-align:left;width:100%}
.slot::before{counter-increment:st;content:counter(st);width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.slot.ok{border-color:var(--verde);background:var(--verde-l)}.slot.bad{border-color:var(--rojo);background:var(--rojo-l)}
.slot small{display:block;color:var(--mut)}
.mapbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;overflow-x:auto}
.mapbox svg{display:block;width:100%;min-width:520px;height:auto}
.flow{stroke-dasharray:8 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
.sentence{background:var(--azul-l);border-radius:12px;padding:10px 14px;font-weight:600;margin:10px 0}

/* Datos */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{background:#f4f7fb;font-weight:700;vertical-align:bottom}
th small{display:block;font-weight:500;color:var(--mut)}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.86rem}
.tab.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.bar{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;font-size:.88rem}
.bar .tr{background:#eef2f8;border-radius:8px;height:26px;overflow:hidden}
.bar .fl{height:100%;background:var(--azul);border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-weight:700;font-size:.8rem;transition:width .5s;min-width:34px}
.lvl{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:#fff}
.lvl .lt{font-weight:800;color:var(--lila);font-size:.85rem}

/* Mapas */
.maps{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:860px){.maps{grid-template-columns:1fr 1fr}}
.map{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.map h3{margin-bottom:2px}
.map svg{width:100%;height:auto;display:block}
.map svg .reg{stroke:#fff;stroke-width:2.5;stroke-linejoin:round;cursor:pointer}
.map svg .reg:hover,.map svg .reg.hl{stroke:var(--ink);stroke-width:3}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;margin-top:6px}
.legend i{display:inline-block;width:16px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid #c9d2e0}
.mapinfo{min-height:24px;font-size:.88rem;color:var(--ink2);margin-top:6px}
.reading{display:flex;flex-wrap:wrap;gap:6px}

/* Presión */
.pchain{display:flex;flex-direction:column;gap:4px;align-items:stretch;max-width:560px}
.pchain .ar{text-align:center;color:var(--mut);font-weight:800}
.pchain label{font-size:.8rem;font-weight:800;color:var(--lila);margin:0}

/* Expediente */
.exp-sec{border-left:4px solid var(--azul);padding:4px 0 4px 14px;margin:14px 0}
.exp-sec h3{margin-bottom:2px}
.rub td:last-child,.rub th:last-child{text-align:center;width:90px}
.final{background:var(--ink);color:#fff;border-radius:20px;padding:28px 22px;text-align:center}
.final p{max-width:46ch;margin:.5em auto;color:#dbe4fa}
.final h2{color:var(--amar)}
.notes li{margin:6px 0}
.teacher summary{cursor:pointer;font-weight:800;font-size:1.05rem}
.teacher ul{padding-left:20px}

.stops{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.stops{grid-template-columns:repeat(4,1fr)}}
.stop{border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff}
.stop b{display:block}.stop.done{border-color:var(--verde);background:var(--verde-l)}
.slot.clue::before{content:"🔎";background:var(--amar-l)}
[hidden]{display:none!important}
.card.lab{border:2px solid var(--verde);background:#f3fbf7}
.labq{font-weight:700;color:#0f5e45;border-left:4px solid var(--verde);padding-left:12px}
.linkbtn{background:none;border:0;color:var(--azul);font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.mapguide{background:var(--amar-l);border:1px solid #f1dc9c;border-radius:14px;padding:12px 14px;margin-top:6px}
.checks{display:grid;gap:6px;grid-template-columns:1fr}
@media(min-width:620px){.checks{grid-template-columns:1fr 1fr}}
.chk{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.92rem;cursor:pointer;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--verde)}
.learn{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.learn{grid-template-columns:repeat(4,1fr)}}
.lrn{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:2px}
.lrn-i{font-size:1.5rem}
.didlist{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:720px){.didlist{grid-template-columns:repeat(2,1fr)}}
.did{display:flex;gap:10px;align-items:center;background:var(--verde-l);border-radius:12px;padding:8px 12px}
.did>span{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;font-weight:800}
.hallazgo{border-left:6px solid var(--azul)}
.resetbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:4px 12px;font-size:.85rem;cursor:pointer;min-height:32px;white-space:nowrap}
.resetbtn:hover{background:rgba(255,255,255,.12)}
/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;z-index:50;transition:transform .35s;box-shadow:0 6px 0 #0b1a36;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast small{display:block;font-weight:500;color:var(--amar)}
.foot{text-align:center;font-size:.8rem;color:var(--mut);padding:20px 16px 30px}
@media print{.top,.toast,.noprint,.foot{display:none!important}body{background:#fff}.card{break-inside:avoid;border-color:#bbb}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="foot">Laboratorio Cartográfico de Miss Viridiana · Geografía Económica</div>
<script>
"use strict";
/* =========================================================
   DATOS DEL CASO
   Las coordenadas x,y de cada etapa son para un esquema (no a escala).
   o = orden de la etapa; etapas con el mismo "o" pueden intercambiarse.
   ========================================================= */
const TERR = ['Valle Verde','Monte Frío','Tierra Cálida','Puerto Azul'];

const SRC = {
  siap:'SIAP – Servicio de Información Agroalimentaria y Pesquera (gob.mx/siap)',
  fao:'FAOSTAT – Organización de las Naciones Unidas para la Alimentación y la Agricultura (fao.org/faostat)',
  inegi:'INEGI – Censos Económicos y Censo Agropecuario (inegi.org.mx)',
  comtrade:'UN Comtrade – Base de datos de comercio internacional de la ONU (comtradeplus.un.org)',
  dm:'Data México – Secretaría de Economía (economia.gob.mx/datamexico)',
  usgs:'USGS – Mineral Commodity Summaries, Servicio Geológico de EE. UU. (usgs.gov)',
  bm:'Banco Mundial – Indicadores del desarrollo mundial (datos.bancomundial.org)'
};

const PRODUCTS = [
 {id:'celular',name:'Teléfono celular',e:'📱',type:'ind',
  prim:'Extracción de litio y cobalto',sec:'Ensamblaje de teléfonos en una fábrica',
  m2:'instalar una planta de ensamblaje de teléfonos celulares',
  stages:[
   {t:'Diseño y software',p:'Centros de diseño e investigación de empresas tecnológicas (p. ej., EE. UU., Corea del Sur)',x:95,y:70,o:1},
   {t:'Extracción de minerales',p:'Minas de litio y cobalto (p. ej., Chile, R. D. del Congo)',x:250,y:250,o:1},
   {t:'Fabricación de componentes',p:'Fábricas de chips, pantallas y baterías en Asia oriental',x:500,y:80,o:2},
   {t:'Ensamblaje',p:'Plantas de ensamblaje (p. ej., China, India)',x:440,y:150,o:3},
   {t:'Transporte marítimo',p:'Ruta transpacífica hacia un puerto mexicano del Pacífico',x:300,y:150,o:4},
   {t:'Distribución',p:'Centros logísticos, tiendas y comercio en línea en México',x:150,y:170,o:5},
   {t:'Consumo',p:'Tu ciudad: compra, uso y desecho',x:120,y:230,o:6}],
  scale:['global'],
  why:'Participan muchos territorios de varios continentes, cada uno especializado en una etapa (diseño, minería, componentes, ensamblaje). Las etapas dependen de flujos internacionales de mercancías, capital e información.',
  ctx:'La República Democrática del Congo es el principal productor mundial de cobalto, mineral usado en baterías.',ctxSrc:'USGS, Mineral Commodity Summaries',
  acts:[['Extracción de minerales para baterías',['minerales','agua','vegetacion']],['Fabricación de chips y componentes',['energia','agua','aire']],['Desecho de aparatos electrónicos',['urbano','minerales']]],
  src:['usgs','comtrade','inegi','dm']},

 {id:'tenis',name:'Tenis',e:'👟',type:'ind',
  prim:'Extracción de petróleo y recolección de hule natural',sec:'Corte, costura y pegado de tenis',
  m2:'instalar una fábrica de tenis',

/* =========================================================
   CLASIFICADOR (tocar o arrastrar)
   ========================================================= */
function classifier(root,items,bins,cfg){
  const place={};items.forEach(i=>place[i.id]=null);
  const order=shuffle(items.map(i=>i.id));
  let sel=null,checked={},fb='',locked=false;
  const it=id=>items.find(i=>i.id===id);
  const chip=id=>{const st=checked[id];return `<button type="button" class="chip ${sel===id?'sel':''} ${st===true?'ok':st===false?'bad':''}" draggable="${locked?'false':'true'}" data-id="${id}">${st===true?'✓ ':st===false?'✗ ':''}${esc(it(id).l)}</button>`;};
  function draw(){
    const free=order.filter(id=>!place[id]);
    root.innerHTML=`<p class="hint-line">Toca una tarjeta y después toca el grupo donde la colocarías. En computadora también puedes arrastrarla.</p>
    <div class="pool drop" data-bin="">${free.map(chip).join('')||'<span class="muted small">Todas las tarjetas están colocadas.</span>'}</div>
    <div class="bins b${bins.length}">${bins.map(b=>`<div class="bin drop ${sel?'armed':''}" data-bin="${b.k}" role="button" tabindex="0" aria-label="Colocar en ${b.l}"><div class="bin-h">${b.i} ${b.l}</div><div class="bin-body">${order.filter(id=>place[id]===b.k).map(chip).join('')}</div></div>`).join('')}</div>
    ${locked?'':`<div class="row"><button type="button" class="btn primary" data-act="check">Revisar clasificación</button>${Object.values(checked).includes(false)?'<button type="button" class="btn ghost" data-act="retry">Devolver las incorrectas</button>':''}</div>`}
    <div>${fb}</div>`;
  }
  function put(id,bin){if(locked||!id)return;place[id]=bin||null;delete checked[id];sel=null;draw();}
  root.addEventListener('click',e=>{
    if(locked)return;
    const c=e.target.closest('.chip');
    if(c){sel=(sel===c.dataset.id)?null:c.dataset.id;draw();return;}
    const a=e.target.closest('[data-act]');
    if(a){if(a.dataset.act==='check')check();else retry();return;}
    const d=e.target.closest('.drop');
    if(d&&sel)put(sel,d.dataset.bin);
  });
  root.addEventListener('keydown',e=>{const d=e.target.closest('.bin');if(d&&sel&&(e.key==='Enter'||e.key===' ')){e.preventDefault();put(sel,d.dataset.bin);}});
  root.addEventListener('dragstart',e=>{const c=e.target.closest('.chip');if(c&&!locked){e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';}});
  root.addEventListener('dragover',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over');}});
  root.addEventListener('dragleave',e=>{const d=e.target.closest('.drop');if(d)d.classList.remove('over');});
  root.addEventListener('drop',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();put(e.dataTransfer.getData('text/plain'),d.dataset.bin);}});
  function check(){
    const un=items.filter(i=>!place[i.id]);
    if(un.length){fb=`<div class="fb info">Aún faltan ${un.length} tarjeta(s) por colocar.</div>`;draw();return;}
    const good=[],bad=[];
    items.forEach(i=>{const ok=i.ok.includes(place[i.id]);checked[i.id]=ok;(ok?good:bad).push(i);});
    if(!bad.length){
      locked=true;
      fb=`<div class="fb ok"><b>¡Clasificación completa!</b><ul>${good.map(i=>`<li class="okl"><b>${esc(i.l)}:</b> ${cfg.ok(i,place[i.id])}</li>`).join('')}</ul></div>`;
      draw();cfg.done();
    }else{
      fb=`<div class="fb bad"><b>${good.length} de ${items.length} bien ubicadas.</b> Revisa las marcadas con ✗:<ul>${bad.map(i=>`<li class="badl"><b>${esc(i.l)}:</b> ${cfg.hint(i)}</li>`).join('')}</ul></div>
      <div class="fb ok"><ul>${good.map(i=>`<li class="okl"><b>${esc(i.l)}:</b> ${cfg.ok(i,place[i.id])}</li>`).join('')}</ul></div>`;
      draw();
    }
  }
  function retry(){items.forEach(i=>{if(checked[i.id]===false){place[i.id]=null;delete checked[i.id];}});fb='';draw();}
  draw();
}

  <div id="m3end"></div>${sourcesBox(p)}</main></div>`;

function routeSVG(p,order){
  const pts=order.map(i=>p.stages[i]);let lines='';
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,r=17;
    lines+=`<line x1="${(a.x+dx/L*r).toFixed(1)}" y1="${(a.y+dy/L*r).toFixed(1)}" x2="${(b.x-dx/L*r).toFixed(1)}" y2="${(b.y-dy/L*r).toFixed(1)}" stroke="#2d6cdf" stroke-width="3" class="flow" marker-end="url(#ah)"/>`;
  }
  let grid='';for(let x=50;x<600;x+=50)grid+=`<line x1="${x}" y1="0" x2="${x}" y2="320" stroke="#e1e8f2"/>`;for(let y=50;y<320;y+=50)grid+=`<line x1="0" y1="${y}" x2="600" y2="${y}" stroke="#e1e8f2"/>`;
  return `<svg viewBox="0 0 600 320" role="img" aria-label="Esquema del recorrido territorial de ${esc(p.name)}">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d6cdf"/></marker></defs>
  <rect width="600" height="320" fill="#f4f8fd"/>${grid}
  <path d="M40,40 C120,10 210,40 230,110 C250,190 160,220 120,280 C80,300 30,250 40,190 C50,130 10,90 40,40Z" fill="#e2ecdf"/>
  <path d="M380,40 C470,20 580,40 575,120 C570,180 500,170 470,210 C430,250 370,200 380,150 C390,110 330,70 380,40Z" fill="#e2ecdf"/>
  <path d="M250,200 C300,180 360,210 350,260 C340,300 280,305 255,280 C235,255 220,215 250,200Z" fill="#e2ecdf"/>
  <text x="12" y="20" font-size="12" font-weight="700" fill="#14284b">Esquema del recorrido de ${esc(p.name.toLowerCase())}</text>
  <text x="12" y="34" font-size="10" fill="#5c6a85">No está a escala · Las áreas verdes son masas de tierra esquemáticas</text>
  <g transform="translate(565,40)"><path d="M0,-16 L6,4 L0,0 L-6,4Z" fill="#14284b"/><text x="0" y="18" font-size="11" text-anchor="middle" font-weight="700" fill="#14284b">N</text></g>
  ${lines}
  ${pts.map((s,i)=>`<g><circle cx="${s.x}" cy="${s.y}" r="14" fill="${i===0?'#1a9e74':i===pts.length-1?'#8a6ee8':'#14284b'}" stroke="#fff" stroke-width="2.5"/><text x="${s.x}" y="${s.y+4}" font-size="12" font-weight="800" text-anchor="middle" fill="#fff">${i+1}</text><text x="${s.x}" y="${s.y+29}" font-size="11" font-weight="700" text-anchor="middle" fill="#14284b" stroke="#f4f8fd" stroke-width="4" paint-order="stroke">${esc(s.t)}</text></g>`).join('')}
  </svg>`;
}

function m5(app){
  const p=P(),D=DATA[p.type],idx=PRODUCTS.indexOf(p);
  const names=TERR.map((_,i)=>TERR[(i+idx)%4]);
  const col=j=>D.rows.map(r=>r[j]);
  const argmax=a=>a.indexOf(Math.max.apply(null,a));
  const ratios=D.rows.map(r=>r[D.n2.num]/r[D.n2.den]);
  const best2=argmax(ratios);
  const I=D.ind;
  const L=[
   {id:'l1',lvl:'Nivel 1 · Observa',q:`¿Qué territorio presenta el valor más alto de ${I[0].l.toLowerCase()}?`,opts:names.map((n,i)=>[n,i===argmax(col(0))?1:0]),
    ok:`Correcto. ${names[argmax(col(0))]} registra ${fmt(Math.max.apply(null,col(0)))} ${I[0].u}. Observar es el primer paso, pero el valor más alto no explica por qué ocurre ni si es "mejor".`,

   {id:'l2',lvl:'Nivel 2 · Compara',q:D.n2.q,opts:names.map((n,i)=>[n,i===best2?1:0]),
    ok:`Correcto. Al dividir ${I[D.n2.num].l.toLowerCase()} entre ${I[D.n2.den].l.toLowerCase()} se obtiene: ${names.map((n,i)=>`${n} ≈ ${fmt(ratios[i])}`).join('; ')} (${D.n2.u}). Un territorio con menos producción total puede ser más eficiente: comparar cocientes permite contrastar territorios de distinto tamaño.`,

   {id:'l3',lvl:'Nivel 3 · Relaciona',q:'¿Qué relación podría existir entre los indicadores?',opts:[[D.rel,1],[`${I[1].l} y producción siempre aumentan en la misma proporción`,0],['Los indicadores no tienen ninguna relación entre sí',0]],
    ok:`Correcto. ${D.rel.toLowerCase()}: ${I[D.relIdx].l.toLowerCase()} acompaña el nivel de producción. Esto anticipa la presión que la actividad ejerce sobre el territorio.`,
    bad:`Revisa ${names[1]}: tiene más ${I[1].l.toLowerCase()} que ${names[0]}, pero menos producción. Busca qué indicador sí cambia junto con la producción en todos los territorios.`},
   {id:'l4',lvl:'Nivel 4 · Interpreta',q:`${names[1]} tiene más ${I[1].l.toLowerCase()} que ${names[0]}, pero menor producción. ¿Qué permite comprender este contraste?`,
    opts:[['Puede reflejar distintas formas de producir: más maquinaria y tecnología en un territorio, más trabajo manual en el otro',1],[`Que las personas de ${names[1]} trabajan menos`,0],['Que los datos están equivocados',0]],
    ok:'Correcto. Los datos no dicen que alguien trabaje menos: sugieren diferencias en tecnología, capital y organización de la producción. Interpretar es proponer explicaciones que los datos permitan sostener.',
    bad:'Cuidado con las conclusiones que los datos no permiten afirmar. Piensa en la tecnología, la maquinaria y la forma de organizar la producción.',
    open:['m5n4','¿Qué nos permiten comprender estos datos sobre la actividad económica de estos territorios?']},
   {id:'l5',lvl:'Nivel 5 · Argumenta',q:'¿Los datos permiten afirmar que un territorio tiene mayor importancia económica que los demás?',opts:[['Sí',2],['No',2],['Depende',2]],
    open:['m5n5','Explica tu postura usando al menos dos indicadores:']}
  ];

  <h3 style="margin-top:16px">Gráfica comparativa</h3><div class="tabs" id="tabs5">${I.map((x,j)=>`<button type="button" class="tab ${j===0?'sel':''}" data-j="${j}">${x.l}</button>`).join('')}</div><div id="bars5"></div>

   ${l.open?`<label class="q" for="${l.open[0]}">${l.open[1]}</label><textarea id="${l.open[0]}" data-note="${l.open[0]}">${esc(S.notes[l.open[0]]||'')}</textarea>`:''}
   <div class="row"><button type="button" class="btn primary" data-chk>Verificar</button></div><div class="lfb"></div></div>`).join('')}

  bars(0);

      const txt=l.open?(S.notes[l.open[0]]||'').trim():'';
      const minLen=l.id==='l5'?40:25;
      if(l.id==='l5'){
        if(txt.length<minLen){fb.innerHTML='<div class="fb info">Desarrolla tu argumento: menciona al menos dos indicadores y explica qué muestra cada uno.</div>';return;}
        const ch=l.opts[s.sel][0];S.notes.m5n5c=ch;save();

        fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?q.ok:q.bad}</div>`;if(!ok)allOk=false;
      }else{
        const t=(S.notes[q.open]||'').trim(),min=q.k==='q5'?30:15;
        if(t.length<min){fb.innerHTML=`<div class="fb info">Escribe tu respuesta${q.k==='q5'?' relacionando al menos un factor natural o socioeconómico':' nombrando las regiones'}.</div>`;allOk=false;}
        else fb.innerHTML='<div class="fb ok">Respuesta registrada. Compárala con tus respuestas cerradas: ¿son coherentes?</div>';
      }
    });
    if(!allOk){$('#fb6').innerHTML='<div class="fb bad">Revisa las preguntas marcadas y vuelve a intentarlo.</div>';return;}
    $('#fb6').innerHTML=`<div class="concept"><b>🧩 Concepto: patrones espaciales</b>La distribución de una actividad casi nunca es homogénea: se <b>concentra</b> donde coinciden ciertos factores. Comparar dos mapas permite proponer relaciones, pero una coincidencia no demuestra por sí sola una causa: hay que argumentarla con evidencia.</div>${nextBtn(6)}`;
    complete(6);
  };
}

function m7(app){
  const p=P(),acts=p.acts.concat(GEN_ACTS);
  const allP=shuffle([].concat(...Object.values(RES).map(r=>r.pres))),allC=shuffle([].concat(...Object.values(RES).map(r=>r.cons)));
  const opt=(arr,ph)=>`<option value="">${ph}</option>`+arr.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');
  app.innerHTML=`<div class="wrap"><main>${head(7,'⚠️','El costo territorial','Las actividades económicas generan beneficios, pero también pueden ejercer presión sobre los territorios y sus recursos.')}${dossier(p)}
  <div class="card"><div class="step-t"><i>Paso 1</i> Construye una cadena de presión</div>
  <p>Elige una actividad del circuito de ${esc(p.name.toLowerCase())} y sigue su efecto sobre el territorio.</p>
  <div class="concept small"><b>Ejemplo</b>Aumento de producción → mayor consumo de agua → presión sobre el recurso hídrico → disminución de la disponibilidad.</div>
  <div class="pchain">
   <label for="a7">Actividad económica</label><select id="a7">${opt(acts.map(a=>a[0]),'Elige una actividad…')}</select><div class="ar">↓</div>
   <label for="r7">Recurso o territorio</label><select id="r7"><option value="">Elige un recurso…</option>${Object.entries(RES).map(([k,r])=>`<option value="${k}">${r.l}</option>`).join('')}</select><div class="ar">↓</div>
   <label for="p7">Presión</label><select id="p7">${opt(allP,'Elige la presión…')}</select><div class="ar">↓</div>
   <label for="c7">Consecuencia</label><select id="c7">${opt(allC,'Elige la consecuencia…')}</select>
  </div>
  <div class="row"><button class="btn primary" id="chk7">Verificar cadena</button></div><div id="fb7"></div></div>
  <div class="card" id="m7b" hidden><div class="step-t"><i>Paso 2</i> Propón una medida</div>
  <p><b>¿Qué medida podría reducir esta presión?</b> No hay una única respuesta: lo importante es que tu propuesta tenga relación lógica con el problema.</p>
  <label class="q">¿En qué parte de la cadena actúa tu medida?</label><div class="pills" id="part7">${['Cambiar la forma de realizar la actividad','Proteger o restaurar el recurso','Disminuir la presión','Atender las consecuencias'].map(x=>`<button type="button" class="pill" data-x="${x}">${x}</button>`).join('')}</div>
  <label class="q" for="m7medida">Describe tu medida: qué se haría, quién la aplicaría y cómo reduciría la presión.</label><textarea id="m7medida" data-note="m7medida">${esc(S.notes.m7medida||'')}</textarea>
  <div class="row"><button class="btn primary" id="go7">Enviar propuesta</button></div><div id="fb7b"></div></div>
  ${sourcesBox(p)}</main></div>`;
  let rec=null,part='',tries=0;
  $('#chk7').onclick=()=>{
    const a=$('#a7').value,r=$('#r7').value,pr=$('#p7').value,c=$('#c7').value;
    if(!a||!r||!pr||!c){$('#fb7').innerHTML='<div class="fb info">Completa los cuatro eslabones de la cadena.</div>';return;}
    const act=acts.find(x=>x[0]===a),R=RES[r],errs=[];
    if(!act[1].includes(r))errs.push(`La actividad “${esc(a)}” no se relaciona de forma directa con ${R.l}. Piensa qué recurso usa, transforma o modifica esa actividad.`);
    if(!R.pres.includes(pr))errs.push(`La presión elegida no corresponde a ${R.l}. ¿Qué le ocurre a ese recurso cuando aumenta la actividad?`);
    if(!R.cons.includes(c))errs.push(`La consecuencia elegida no se deriva de una presión sobre ${R.l}. ¿Qué efecto tendría para la población o el territorio?`);
    if(errs.length){$('#fb7').innerHTML=`<div class="fb bad">Tu cadena tiene eslabones que no se conectan:<ul>${errs.map(e=>`<li>${e}</li>`).join('')}</ul></div>`;return;}
    rec=r;S.notes.m7chain=`${a} → ${R.l.replace(/^\S+\s/,'')} → ${pr} → ${c}`;save();
    $('#fb7').innerHTML=`<div class="fb ok"><b>Cadena coherente.</b> Cada eslabón explica al siguiente.<div class="chain"><span>${esc(a)}</span><em>→</em><span>${R.l}</span><em>→</em><span>${esc(pr)}</span><em>→</em><span>${esc(c)}</span></div></div>`;
    $('#m7b').hidden=false;scrollToEl($('#m7b'));
  };
  $$('#part7 .pill').forEach(b=>b.onclick=()=>{part=b.dataset.x;$$('#part7 .pill').forEach(x=>x.classList.toggle('sel',x===b));});
  $('#go7').onclick=()=>{
    const t=(S.notes.m7medida||'').trim();
    if(!part||t.length<20){$('#fb7b').innerHTML='<div class="fb info">Elige en qué parte de la cadena actúa tu medida y descríbela con al menos una oración completa.</div>';return;}
    const R=RES[rec],hit=R.kw.test(norm(t));tries++;
    if(!hit&&tries<2){$('#fb7b').innerHTML=`<div class="fb bad">No queda claro cómo tu medida atiende la presión sobre <b>${R.l}</b>. Explica qué cambiaría tu medida en ese recurso o en la actividad que lo presiona, y vuelve a enviarla.</div>`;return;}
    $('#fb7b').innerHTML=`<div class="fb ${hit?'ok':'info'}">${hit?`<b>Propuesta coherente.</b> Tu medida se relaciona con ${R.l} y actúa sobre: ${part.toLowerCase()}.`:'<b>Propuesta registrada.</b> Revisa en tu expediente que la relación entre tu medida y el recurso afectado quede explícita.'} Pregúntate también: ¿quién pagaría el costo de aplicarla y qué agente tendría que participar (empresas, gobierno, consumidores)?</div>
    <div class="concept"><b>🧩 Concepto: presión sobre el territorio</b>Toda actividad económica usa y transforma recursos. Cuando la intensidad de uso supera la capacidad del territorio para recuperarse, aparece la <b>presión territorial</b>: escasez, contaminación, pérdida de suelo o de biodiversidad, saturación de infraestructura. Analizarla permite pensar cómo producir y consumir de otra manera.</div>${nextBtn(7)}`;
    complete(7);
  };
}

  if((S.screen==='exp'||S.screen==='cierre')&&!unlocked(8))S.screen='home';
  renderTop();
  const app=$('#app');app.innerHTML='';
  (SCREENS[S.screen]||renderHome)(app);
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(!g)return;
  const t=g.dataset.go;
  if(t==='home'||t==='select'){go(t);return;}
  if(t==='exp'||t==='cierre'){if(unlocked(8))go(t);else toast('Completa las 7 misiones','para abrir el expediente');return;}
  const k=+t.slice(1);
  if(unlocked(k))go(t);else toast(S.prod?'Misión bloqueada':'Primero elige un producto',S.prod?'Completa la misión anterior para desbloquearla':'');
});
document.addEventListener('click',e=>{
  if(!e.target.closest('[data-reset]'))return;
  if(!confirm('¿Reiniciar la investigación? Se borrarán tu producto, tu progreso y tus respuestas guardadas en este dispositivo.'))return;
  S={prod:null,done:[0,0,0,0,0,0,0],notes:{},screen:'home'};save();go('home');toast('Investigación reiniciada','Puedes elegir un producto nuevo');
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.note;if(k){S.notes[k]=e.target.value;save();}});
render();
</script>
</body>
</html>

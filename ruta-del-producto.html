<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misión: sigue la ruta del producto | Laboratorio Cartográfico de Miss Viridiana</title>
<meta name="description" content="Actividad interactiva de Geografía Económica: agentes y factores en circuitos productivos globales.">
<style>
/* =========================================================
   1. TOKENS DE DISEÑO
   Paleta: lila, rosa suave, azul, amarillo y blanco.
   Tipografía: pila redondeada del sistema (funciona sin conexión).
   ========================================================= */
:root{
  --ink:#2A2150;        /* tinta violeta: texto principal */
  --ink2:#5E5494;       /* texto secundario */
  --lila:#8E7CF0;
  --lila-d:#6B58D6;
  --lila-s:#EEEAFF;
  --rosa:#F29BC0;
  --rosa-d:#DC5F97;
  --rosa-s:#FDEBF3;
  --azul:#5FA8F5;
  --azul-d:#2F7FDB;
  --azul-s:#E4F1FF;
  --amar:#FFD35C;
  --amar-d:#D9A400;
  --amar-s:#FFF5D4;
  --ok:#17906E;
  --ok-s:#E2F6EE;
  --bad:#D2436B;
  --bad-s:#FDE8EE;
  --paper:#F8F6FF;
  --line:#DDD6FB;
  --r-lg:24px;
  --r-md:16px;
  --r-sm:10px;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}

/* =========================================================
   2. BASE
   ========================================================= */
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{
  margin:0;font-family:var(--font);color:var(--ink);line-height:1.5;font-size:17px;
  background-color:var(--paper);
  /* Cuadrícula tipo papel cartográfico */
  background-image:
    linear-gradient(rgba(142,124,240,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(142,124,240,.09) 1px,transparent 1px);
  background-size:44px 44px;
}
h1,h2,h3{line-height:1.15;margin:0}
p{margin:.4em 0}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--amar-d);outline-offset:3px;border-radius:8px}

/* =========================================================
   3. BARRA SUPERIOR + PROGRESO EN FORMA DE RUTA
   ========================================================= */
.topbar{
  position:sticky;top:0;z-index:40;
  padding-top:env(safe-area-inset-top,0px);
  background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1.5px solid var(--line);
}
.tb-inner{max-width:1080px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--ink2);font-weight:700;line-height:1.2;max-width:170px}
.brand-mark{font-size:1.6rem}
.tb-main{min-width:0}
.tb-title{font-weight:900;font-size:clamp(.82rem,1.9vw,1rem);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-prog{display:flex;align-items:center;margin-top:6px;max-width:440px}
.rp-pin{
  flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:.75rem;font-weight:900;background:#fff;border:2px solid var(--line);color:var(--ink2);
  transition:background .3s,border-color .3s,transform .3s;
}
.rp-pin.done{background:var(--lila);border-color:var(--lila);color:#fff}
.rp-pin.active{background:var(--amar);border-color:var(--ink);color:var(--ink);transform:scale(1.12)}
.rp-seg{flex:1;height:3px;margin:0 3px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px)}
.rp-seg.done{background:var(--lila)}
.prog-label{font-size:.78rem;color:var(--ink2);font-weight:700;margin-top:3px}
.tb-actions{display:flex;align-items:center;gap:10px}
.pts{font-weight:900;font-size:.85rem;background:var(--amar-s);border:1.5px solid var(--amar);padding:6px 12px;border-radius:999px;white-space:nowrap}
.btn-restart{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:.82rem;cursor:pointer;white-space:nowrap}
.btn-restart:hover{border-color:var(--lila)}

/* =========================================================
   4. CONTENEDOR, TARJETAS Y BOTONES
   ========================================================= */
main{max-width:1000px;margin:0 auto;padding:26px 16px 40px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:20px}
.stack>*+*{margin-top:18px}
.reveal{scroll-margin-top:120px;margin-top:18px}
.reveal>*+*{margin-top:18px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0;border-radius:999px;padding:13px 22px;min-height:48px;
  font-weight:900;cursor:pointer;transition:transform .15s,box-shadow .15s,background .2s;
}
.btn.primary{background:var(--ink);color:#fff;box-shadow:0 4px 0 var(--lila-d)}
.btn.primary:hover{transform:translateY(-1px)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--lila-d)}
.btn.primary:disabled{background:#B9B3D6;box-shadow:none;cursor:not-allowed;transform:none}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--lila)}
.btn.big{font-size:1.05rem;padding:16px 28px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
.next{display:flex;justify-content:flex-end;margin-top:22px}
.counter{font-size:.85rem;color:var(--ink2);font-weight:700}

/* Encabezado de misión */
.m-head{margin-bottom:20px}
.m-tag{display:inline-block;background:var(--ink);color:#fff;font-weight:900;font-size:.8rem;padding:5px 12px;border-radius:999px;transform:rotate(-2deg)}
.m-head h2{font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:900;margin-top:10px;letter-spacing:-.01em}
.lead{color:var(--ink2);font-size:1.05rem;max-width:62ch}
.q-prompt{font-weight:800;font-size:1.1rem;max-width:65ch}
.hint{color:var(--ink2);font-size:.92rem}

/* Chips seleccionables */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chip{
  display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:10px 16px;
  background:#fff;border:2px solid var(--line);border-radius:14px;font-weight:800;cursor:pointer;
  transition:border-color .15s,background .15s,transform .15s;text-align:left;
}
.chip:hover{border-color:var(--lila)}
.chip.on{border-color:var(--lila-d);background:var(--lila-s)}
.chip.good{border-color:var(--ok);background:var(--ok-s)}
.chip.badc{border-color:var(--bad);background:var(--bad-s)}
.chip:disabled{cursor:default}
.chip.small{min-height:42px;padding:8px 12px;font-size:.92rem}

/* Retroalimentación */
.fb{border-radius:var(--r-md);padding:14px 16px;margin-top:14px;border-left:6px solid;animation:pop .35s ease}
.fb.ok{background:var(--ok-s);border-color:var(--ok)}
.fb.bad{background:var(--bad-s);border-color:var(--bad)}
.fb.info{background:var(--amar-s);border-color:var(--amar-d)}
.fb ul.why{margin:.5em 0 .2em;padding-left:0;list-style:none}
.fb ul.why li{margin:.35em 0;padding-left:0}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Opciones múltiples */
.opts{display:grid;gap:10px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  background:#fff;border:2px solid var(--line);border-radius:var(--r-md);padding:12px 14px;min-height:52px;
  font-weight:700;cursor:pointer;transition:border-color .15s,background .15s;
}
.opt:hover:not(:disabled){border-color:var(--lila)}
.opt-k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--lila-s);font-weight:900}
.opt.is-ok{border-color:var(--ok);background:var(--ok-s)}
.opt.is-ok .opt-k{background:var(--ok);color:#fff}
.opt.is-bad{border-color:var(--bad);background:var(--bad-s);opacity:.75}
.opt.is-bad .opt-k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}

.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* Insignia en línea */
.badge-inline{display:flex;align-items:center;gap:14px;background:var(--amar-s);border:2px dashed var(--amar-d);border-radius:var(--r-lg);padding:14px 18px;margin-top:18px;animation:pop .4s ease}
.badge-inline .b-e{font-size:2.2rem}
.badge-inline small{display:block;color:var(--ink2);font-weight:700}
.badge-inline strong{font-size:1.05rem}

/* Ilustraciones */
.illo{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--azul-s);border-color:#CFE3FB}
.illo svg{width:100%;max-width:340px;height:auto}
.illo figcaption{font-weight:800;color:var(--ink2);text-align:center;margin-top:6px}
figure{margin:0}

/* =========================================================
   5. PANTALLA DE INICIO
   ========================================================= */
.hero{text-align:center;padding:10px 0 20px}
.hero-art{max-width:640px;margin:0 auto}
.hero-art svg{width:100%;height:auto}
.hero-brand{font-weight:800;color:var(--lila-d);font-size:.95rem;margin-top:6px}
.hero h1{font-size:clamp(2rem,6.4vw,3.6rem);font-weight:900;letter-spacing:-.02em;margin:10px auto 0;max-width:15ch}
.hero-sub{font-size:clamp(1.1rem,3vw,1.35rem);font-weight:800;color:var(--rosa-d);margin-top:14px}
.hero-intro{max-width:56ch;margin:12px auto 0;color:var(--ink2);font-size:1.05rem}
.hero-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:22px 0}
.hero-meta span{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.9rem}
.hero-topic{font-size:.85rem;color:var(--ink2);margin-top:18px}
.hero-route{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.6s .3s ease forwards}
.hero-pin{opacity:0;animation:pinIn .4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pinIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* =========================================================
   6. MISIÓN 0: PRODUCTOS
   ========================================================= */
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.prod{
  position:relative;background:#fff;border:2px solid var(--line);border-radius:var(--r-lg);padding:22px 12px;
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-height:170px;justify-content:center;
  transition:transform .2s,border-color .2s,background .2s;
}
.prod:hover{transform:translateY(-3px);border-color:var(--lila)}
.prod .p-e{font-size:3.4rem;line-height:1}
.prod .p-n{font-weight:900;font-size:1.15rem;letter-spacing:.04em}
.prod .p-s{font-size:.78rem;font-weight:800;color:var(--ink2)}
.prod.soon{opacity:.62}
.prod.soon .p-s{background:var(--lila-s);padding:3px 10px;border-radius:999px}
.prod.on{border-color:var(--ink);background:var(--amar-s);transform:translateY(-3px) rotate(-1deg)}

/* =========================================================
   7. MISIONES 1-3
   ========================================================= */
.grid-m1{display:grid;grid-template-columns:1fr 1.35fr;gap:18px;align-items:stretch}
.pista{background:var(--lila-s);border-color:#D3CAFB}
.pista-h{font-weight:900;color:var(--lila-d)}
.pista-t{font-size:1.15rem;font-weight:800}

.terr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.terr{
  text-align:left;background:#fff;border:2px solid var(--line);border-radius:var(--r-lg);padding:0;overflow:hidden;cursor:pointer;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.terr:hover{border-color:var(--lila)}
.terr.on{border-color:var(--ink);box-shadow:0 6px 0 var(--lila);transform:translateY(-3px)}
.terr-top{padding:16px 16px 12px}
.t-A .terr-top{background:var(--amar-s)}
.t-B .terr-top{background:var(--rosa-s)}
.t-C .terr-top{background:var(--azul-s)}
.terr-emoji{font-size:2rem;display:block}
.terr-code{display:block;font-size:.8rem;font-weight:800;color:var(--ink2);margin-top:4px}
.terr-name{display:block;font-weight:900;font-size:1.25rem}
.terr ul{margin:0;padding:12px 16px 16px 34px;font-size:.95rem}
.terr li{margin:.2em 0}
.big-quote{font-size:clamp(1.15rem,3vw,1.4rem);font-weight:800;max-width:48ch}
.quote{background:var(--ink);color:#fff;border-color:var(--ink)}
.quote p:not(.big-quote){color:#DCD6FF}

.grid-m3{display:grid;grid-template-columns:1fr 1.35fr;gap:18px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:70px;margin-top:18px}
.pool:empty::after{content:"✔ Todas las tarjetas están clasificadas";color:var(--ok);font-weight:800}
.tag{
  display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:14px;
  background:#fff;border:2px solid var(--ink);font-weight:900;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 3px 0 var(--line);transition:transform .15s,background .15s;
}
.tag.selected{background:var(--amar);transform:translateY(-3px) rotate(-2deg)}
.tag.lifting{opacity:.35}
.tag.placed{pointer-events:none;cursor:default;box-shadow:none;border-color:var(--ok);background:#fff}
.tag.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg);background:var(--amar);box-shadow:0 10px 24px rgba(42,33,80,.25)}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.zone{border:3px dashed var(--line);border-radius:var(--r-lg);padding:14px;min-height:190px;cursor:pointer;transition:border-color .2s,background .2s}
.z-agente{background:var(--rosa-s);border-color:#F4C2D8}
.z-factor{background:var(--azul-s);border-color:#BFDAF8}
.zone.hover,.zone.armed{border-color:var(--ink);border-style:solid}
.zone.armed{animation:armed 1.2s ease infinite}
@keyframes armed{50%{box-shadow:0 0 0 5px rgba(255,211,92,.6)}}
.zone-h b{display:block;font-size:1.15rem;font-weight:900}
.zone-h small{color:var(--ink2);font-weight:700}
.zone-b{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.zone-b .tag{min-height:40px;padding:6px 12px;font-size:.9rem}

/* =========================================================
   8. MISIÓN 4: MAPA MUNDIAL Y RUTA
   ========================================================= */
.map-card{padding:14px}
.map-wrap{overflow-x:auto;border-radius:var(--r-md);-webkit-overflow-scrolling:touch}
.map-wrap svg{display:block;width:100%;min-width:760px;height:auto;border-radius:var(--r-md)}
.land{fill:#E7E1FF;stroke:#B7A9F4;stroke-width:.8;stroke-linejoin:round}
.grat{stroke:#fff;stroke-width:1;opacity:.75}
.equator{stroke:#fff;stroke-width:1.4;stroke-dasharray:4 5}
.grat-lbl{font-size:9px;fill:#6E9BD6;font-weight:700}
.cont-lbl{font-size:11.5px;font-weight:900;fill:#8374D6;letter-spacing:.14em}
.ocean-lbl{font-size:12.5px;font-style:italic;font-weight:700;fill:#4B87CF}
.route{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.route.mar{stroke:var(--azul-d)}
.route.tierra{stroke:var(--rosa-d)}
.route.aire{stroke:var(--amar-d);stroke-dasharray:7 6;stroke-width:2.6}
.mk-path{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round}
.pin-halo{fill:#fff;stroke:var(--ink);stroke-width:2}
.pin-dot{fill:var(--rosa-d)}
.pin-lbl{font-size:12.5px;font-weight:900;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.pin-n{opacity:0;transition:opacity .4s}
.pin-n circle,.pin-n rect{fill:var(--amar);stroke:var(--ink);stroke-width:1.5}
.pin-n text{font-size:10px;font-weight:900;fill:var(--ink)}
.ordered .pin-n{opacity:1}
.mover{font-size:21px;opacity:0}
.inset-bg{fill:var(--azul-s);stroke:var(--ink);stroke-width:1.5}
.inset-land{fill:#E7E1FF;stroke:#B7A9F4;stroke-width:1}
.inset-t{font-size:11px;font-weight:900;fill:var(--ink2)}
.leader{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 3;fill:none}
.zoom-box{fill:none;stroke:var(--ink);stroke-width:1.2}

.chain{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin-top:12px}
.ch{font-size:.78rem;font-weight:900;letter-spacing:.03em;padding:6px 10px;border-radius:999px;background:var(--lila-s);color:var(--ink2);transition:background .3s,color .3s,transform .3s}
.ch.on{background:var(--ink);color:#fff;transform:scale(1.06)}
.ch.done{background:var(--lila);color:#fff}
.ch-arrow{color:var(--lila);font-weight:900}
.route-cap{text-align:center;font-weight:800;min-height:1.5em;margin-top:10px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-top:10px;font-size:.88rem;font-weight:800;color:var(--ink2)}
.legend i{display:inline-block;width:22px;height:0;border-top:3.5px solid;vertical-align:middle;margin-right:6px;border-radius:2px}
.lg-mar{border-color:var(--azul-d)!important}
.lg-tierra{border-color:var(--rosa-d)!important}
.lg-aire{border-top-style:dashed!important;border-color:var(--amar-d)!important}
.map-note{font-size:.78rem;color:var(--ink2);text-align:center;margin-top:8px}
.swipe-hint{display:none;font-size:.8rem;color:var(--ink2);text-align:center;margin-top:6px;font-weight:700}

.slots{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{
  border:2px dashed var(--line);border-radius:var(--r-md);padding:10px 12px;min-height:74px;background:var(--paper);
  display:flex;gap:10px;align-items:flex-start;cursor:default;
}
.slot .s-n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#fff;border:2px solid var(--line);font-size:.85rem}
.slot .s-t{font-weight:900;font-size:.95rem;line-height:1.25}
.slot .s-d{display:block;font-weight:600;font-size:.8rem;color:var(--ink2);margin-top:2px}
.slot.filled{border-style:solid;border-color:var(--lila);background:#fff;cursor:pointer}
.slot.filled .s-n{background:var(--lila);border-color:var(--lila);color:#fff}
.slot.good{border-color:var(--ok);background:var(--ok-s)}
.slot.good .s-n{background:var(--ok);border-color:var(--ok)}
.slot.wrong{border-color:var(--bad);background:var(--bad-s)}
.slot.wrong .s-n{background:var(--bad);border-color:var(--bad)}
.slot.locked{cursor:default}

.stops{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.stop{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.stop-h{display:flex;align-items:center;gap:8px}
.stop-n{width:26px;height:26px;border-radius:50%;background:var(--amar);border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:.8rem;flex:none}
.stop b{font-size:.98rem}
.stop p{font-size:.88rem;color:var(--ink2);margin:.35em 0 0}
.coord{display:block;font-size:.74rem;font-weight:800;color:var(--lila-d);margin-top:4px;font-variant-numeric:tabular-nums}

/* =========================================================
   9. MISIÓN 5: RADIOGRAFÍA
   ========================================================= */
.xray{background:#fff;border:2px solid var(--ink);border-radius:var(--r-lg);overflow:hidden}
.xray-h{background:var(--ink);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.xray-h h3{font-size:clamp(1.1rem,3.4vw,1.45rem);font-weight:900;letter-spacing:.02em}
.xray-body{padding:6px 20px 20px}
.rx-field{padding:16px 0;border-bottom:1.5px dashed var(--line)}
.rx-field:last-child{border-bottom:0}
.rx-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.rx-top h4{margin:0;font-size:1.05rem;font-weight:900}
.rx-val{flex:1;min-width:140px;border-bottom:2.5px solid var(--line);padding:0 4px 2px;font-weight:800;color:var(--lila-d);min-height:1.6em}
.rx-val.filled{border-color:var(--ok);color:var(--ok)}
.rx-note{font-size:.85rem;color:var(--ink2);margin-top:4px}
.rx-fb{font-size:.9rem;margin-top:8px;font-weight:700}

}

}

/* =========================================================
   D. ESTADO DE LA ACTIVIDAD
   (solo en memoria: al recargar la página se reinicia)
   ========================================================= */
function freshState(){
  return { screen:'home', product:null, scores:{}, answers:{ rx:{} }, badges:[], flags:{} };
}
let S = freshState();
const P = () => DATA[S.product];
const total = () => Object.values(S.scores).reduce((a, b) => a + b, 0);

/* Puntaje según intentos: 1.º intento completo, luego disminuye */
function award(id, tries){
  const f = [1, .6, .35, .2][Math.min(tries, 3)];
  S.scores[id] = Math.round(POINTS[id] * f);
  updateTopbar();
}
function setScore(id, pts){ S.scores[id] = pts; updateTopbar(); }

/* =========================================================
   E. NAVEGACIÓN Y BARRA SUPERIOR
   ========================================================= */
const RENDER = {
  home:renderHome, choose:renderChoose,
  m1:renderM1, m2:renderM2, m3:renderM3, m4:renderM4, m5:renderM5,
  final:renderFinal
};
function go(screen){
  S.screen = screen;
  app.innerHTML = '';
  RENDER[screen]();
  updateTopbar();
  window.scrollTo({ top:0, behavior: REDUCED ? 'auto' : 'smooth' });
  app.focus({ preventScroll:true });
}
function updateTopbar(){
  const n = { m1:1, m2:2, m3:3, m4:4, m5:5 }[S.screen] || (S.screen === 'final' ? 6 : 0);
  $$('#routeProg .rp-pin').forEach((p, i) => {
    p.classList.toggle('done', i + 1 < n);
    p.classList.toggle('active', i + 1 === n);
    p.textContent = i + 1 < n ? '✓' : i + 1;
  });
  $$('#routeProg .rp-seg').forEach((s, i) => s.classList.toggle('done', i + 2 <= n));
  $('#progLabel').textContent =
    S.screen === 'home'   ? 'Pantalla de inicio' :
    S.screen === 'choose' ? 'Misión 0: elige tu producto' :
    S.screen === 'final'  ? '¡Misión completada!' : `Misión ${n} de 5`;
  $('#pts').textContent = `⭐ ${total()}`;
}
$('#btnRestart').addEventListener('click', () => {
  if (S.screen === 'home' || confirm('¿Reiniciar la misión? Se borrará tu avance.')) restart();
});
function restart(){ S = freshState(); go('home'); }

/* Encabezado común de cada misión */
function shell(n, emoji, title, lead){
  return `<section class="m-head">
    <span class="m-tag">Misión ${n}</span>
    <h2><span aria-hidden="true">${emoji}</span> ${title}</h2>
    ${lead ? `<p class="lead">${lead}</p>` : ''}
  </section>`;
}
function nextBtn(host, label, fn){
  host.insertAdjacentHTML('beforeend', `<div class="next"><button class="btn primary big" type="button">${label}</button></div>`);
  host.querySelector('.next:last-child button').addEventListener('click', fn);
}

/* =========================================================
   F. COMPONENTES REUTILIZABLES
   ========================================================= */

/* Pregunta de opción múltiple con reintento y explicación */
function mcq(host, q, onDone){
  let tries = 0;
  host.innerHTML = `<div class="card">
    <p class="q-prompt">${q.prompt}</p>
    <div class="opts">${q.options.map((o, i) =>
      `<button class="opt" type="button" data-i="${i}"><span class="opt-k">${o.k}</span><span>${o.t}</span></button>`).join('')}
    </div>
    <div class="fb-slot"></div>
  </div>`;
  const slot = host.querySelector('.fb-slot');
  host.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const o = q.options[+b.dataset.i];
    if (o.ok){
      award(q.id, tries);
      S.answers[q.id] = o.t;
      host.querySelectorAll('.opt').forEach(x => x.disabled = true);
      b.classList.add('is-ok');
      fb(slot, 'ok', `<strong>¡Bien razonado!</strong> ${q.explain}`);
      onDone && onDone();
    } else {
      tries++;
      b.classList.add('is-bad'); b.disabled = true; shake(b);
      fb(slot, 'bad', `<strong>Todavía no.</strong> ${o.why} Vuelve a intentarlo.`);
    }
  }));
}

/* Insignia: sello animado + tarjeta dentro de la misión */
function giveBadge(key, host){
  if (!S.badges.includes(key)) S.badges.push(key);
  const b = BADGES[key];
  host.insertAdjacentHTML('beforeend', `<div class="badge-inline"><span class="b-e" aria-hidden="true">${b.e}</span><div><small>Insignia obtenida</small><strong>${b.t.toUpperCase()}</strong></div></div>`);
  const toast = $('#toast');
  toast.innerHTML = `<div class="stamp"><span class="st-e">${b.e}</span><span class="st-k">INSIGNIA</span><span class="st-t">${b.t}</span></div>`;
  setTimeout(() => { toast.innerHTML = ''; }, REDUCED ? 1400 : 2300);
}

/* =========================================================
   H. MAPA MUNDIAL ESTILIZADO
   Proyección equirectangular. Cada producto elige una "vista":
   · pacific: centrada en el Pacífico; América se desplaza +360°
     para que las rutas Asia → México sean continuas.
   · atlantic: centrada en el Atlántico (América, Europa y África),
     con más acercamiento.
   ========================================================= */
const VIEWS = {
  pacific:{ LON0:-25, LAT0:80, K:1000/370, H:375, shift:true,
    conts:[['AMÉRICA DEL NORTE', -100, 47], ['AMÉRICA DEL SUR', -60, -12], ['EUROPA', 15, 55], ['ÁFRICA', 20, 8], ['ASIA', 92, 55], ['OCEANÍA', 134, -26]],
    oceans:[['Océano Pacífico', -155, -5, 'middle'], ['Océano Índico', 75, -22, 'middle'], ['Océano Atlántico', 'R', 32, 'end']] },
  atlantic:{ LON0:-125, LAT0:64, K:5, H:420, shift:false,
    conts:[['AMÉRICA DEL NORTE', -102, 45], ['AMÉRICA DEL SUR', -58, -8], ['EUROPA', 22, 56], ['ÁFRICA', 22, 12], ['ASIA', 62, 48]],
    oceans:[['Océano Atlántico', -42, 26, 'middle'], ['Océano Pacífico', -114, 14, 'middle']] },
};
const MAP = { W:1000 };
let VIEW = VIEWS.pacific;
function proj(lon, lat, forceShift){
  const V = VIEW;
  const L = V.shift && (forceShift || lon < -30) ? lon + 360 : lon;
  return [ +((L - V.LON0) * V.K).toFixed(1), +((V.LAT0 - lat) * V.K).toFixed(1) ];
}
/* Recuadro de acercamiento (posición y zona definidas por cada producto en m4.inset) */
const INSET_DEF = { w:170, h:102, s:17 };
let INSET = null;
function projInset(lon, lat){
  return [ +(INSET.x + (lon - INSET.lon0) * INSET.s).toFixed(1), +(INSET.y + (INSET.lat0 - lat) * INSET.s).toFixed(1) ];
}

/* Convierte puntos en una curva suave (Catmull-Rom → Bézier) */
function smoothPath(P){
  if (P.length < 3) return `M${P[0].join(',')} L${P[1].join(',')}`;
  let d = `M${P[0][0]},${P[0][1]}`;
  for (let i = 0; i < P.length - 1; i++){
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
const polyPath = (pts, fn) => 'M' + pts.map(p => fn(p).join(',')).join('L') + 'Z';

/* Número de etapa: círculo para "3", píldora para "1-2" */
function numBadge(n, x, y){
  const t = String(n), w = 8 + t.length * 5;
  const shape = t.length > 1 ? `<rect x="${-w / 2}" y="-8" width="${w}" height="16" rx="8"/>` : '<circle r="8"/>';
  return `<g class="pin-n" transform="translate(${x + (t.length > 1 ? w / 2 - 8 : 0)} ${y})">${shape}<text text-anchor="middle" dy="3.5">${t}</text></g>`;
}
function pinSVG(x, y, lbl, dx, dy, a, n, bx = 9, by = -11){
  return `<g transform="translate(${x} ${y})">
    <circle class="pin-halo" r="7.5"/><circle class="pin-dot" r="3.8"/>
    <text class="pin-lbl" x="${dx}" y="${dy}" text-anchor="${a}">${lbl}</text>
    ${n ? numBadge(n, bx, by) : ''}
  </g>`;
}

function buildMap(d, label){
  VIEW = VIEWS[d.view || 'pacific'];
  INSET = Object.assign({}, INSET_DEF, d.inset);
  MAP.H = VIEW.H;
  const nAm = GEO.map(g => `<path class="land" d="${polyPath(g.pts, p => proj(p[0], p[1], g.am))}"/>`).join('');
  /* Retícula de coordenadas */
  let grat = '';
  const lonSpan = MAP.W / VIEW.K;
  for (let L = Math.ceil(VIEW.LON0 / 30) * 30; L <= VIEW.LON0 + lonSpan; L += 30){
    const x = ((L - VIEW.LON0) * VIEW.K).toFixed(1);
    grat += `<line class="grat" x1="${x}" y1="0" x2="${x}" y2="${MAP.H}"/>`;
  }
  [60, 30, -30].forEach(lat => { const y = ((VIEW.LAT0 - lat) * VIEW.K).toFixed(1); if (y < 8 || y > MAP.H - 4) return; grat += `<line class="grat" x1="0" y1="${y}" x2="${MAP.W}" y2="${y}"/><text class="grat-lbl" x="4" y="${(+y - 3)}">${Math.abs(lat)}°${lat > 0 ? 'N' : 'S'}</text>`; });
  const eqY = (VIEW.LAT0 * VIEW.K).toFixed(1);
  grat += `<line class="equator" x1="0" y1="${eqY}" x2="${MAP.W}" y2="${eqY}"/><text class="grat-lbl" x="4" y="${eqY - 3}">Ecuador 0°</text>`;

  /* Tramos: línea visible + máscara que se "dibuja" + icono móvil */
  let defs = '', routes = '', movers = '';
  Object.entries(d.legs).forEach(([id, leg]) => {
    const pts = leg.pts.map(p => leg.inset ? projInset(p[0], p[1]) : proj(p[0], p[1]));
    const path = smoothPath(pts);
    defs += `<mask id="mk-${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="${MAP.W}" height="${MAP.H}"><path class="mk-path" d="${path}"/></mask>`;
    routes += `<path id="rt-${id}" class="route ${leg.mode}" d="${path}" mask="url(#mk-${id})" ${leg.inset ? 'clip-path="url(#insetClip)"' : ''}/>`;
    movers += `<text id="mv-${id}" class="mover" text-anchor="middle" dominant-baseline="central">${leg.icon}</text>`;
  });

  const pins = d.pins.map(p => { const [x, y] = proj(p.lon, p.lat); return pinSVG(x, y, p.lbl, p.dx, p.dy, p.a, p.n, p.bx, p.by); }).join('');
  /* Etiqueta flotante de la etapa de transporte (sobre el océano) */
  const pl = d.seaLabel, [plx, ply] = proj(pl.lon, pl.lat);
  const pacLbl = `<g transform="translate(${plx} ${ply})"><text class="pin-lbl" text-anchor="middle">${pl.lbl}</text>${numBadge(pl.n, 0, -24)}</g>`;

  /* Recuadro del centro de México */
  const I = INSET;
  const zb1 = proj(I.lon0, I.lat0), zb2 = proj(I.lon0 + I.w / I.s, I.lat0 - I.h / I.s);
  const mexico = GEO[0];
  const insetPins = d.insetPins.map(p => { const [x, y] = projInset(p.lon, p.lat); return pinSVG(x, y, p.lbl, p.dx, p.dy, p.a, p.n, p.bx, p.by); }).join('');
  const inset = `
    <rect class="zoom-box" x="${zb1[0]}" y="${zb1[1]}" width="${(zb2[0] - zb1[0]).toFixed(1)}" height="${(zb2[1] - zb1[1]).toFixed(1)}" rx="2"/>
    <path class="leader" d="M${((zb1[0] + zb2[0]) / 2).toFixed(1)},${I.y > zb2[1] ? zb2[1] : zb1[1]} L${I.x + I.w / 2},${I.y > zb2[1] ? I.y : I.y + I.h}"/>
    <rect class="inset-bg" x="${I.x}" y="${I.y}" width="${I.w}" height="${I.h}" rx="10"/>
    <path class="inset-land" clip-path="url(#insetClip)" d="${polyPath(mexico.pts, p => projInset(p[0], p[1]))}"/>
    <text class="inset-t" x="${I.x + 8}" y="${I.y + 15}">${I.title || 'Centro de México'}</text>`;

  const cont = VIEW.conts
    .map(([t, lo, la]) => { const [x, y] = proj(lo, la); return `<text class="cont-lbl" x="${x}" y="${y}" text-anchor="middle">${t}</text>`; }).join('');
  const oceans = VIEW.oceans.map(([t, lo, la, a]) => {
    const [x, y] = lo === 'R' ? [MAP.W - 5, proj(0, la)[1]] : proj(lo, la);
    return `<text class="ocean-lbl" x="${x}" y="${y}" text-anchor="${a}">${t}</text>`;
  }).join('');

  return `<svg id="worldMap" viewBox="0 0 ${MAP.W} ${MAP.H}" role="img" aria-label="Mapa mundial con la ruta de ${label}">
    <defs>
      <linearGradient id="oceanG" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#EAF4FF"/><stop offset="1" stop-color="#D8EAFD"/></linearGradient>
      <clipPath id="insetClip"><rect x="${I.x}" y="${I.y}" width="${I.w}" height="${I.h}" rx="10"/></clipPath>
      ${defs}
    </defs>
    <rect width="${MAP.W}" height="${MAP.H}" fill="url(#oceanG)"/>
    ${grat}${nAm}${cont}${oceans}${inset}
    ${routes}${pins}${pacLbl}${insetPins}${movers}
  </svg>`;
}

/* Anima un tramo: dibuja la línea y mueve el icono sobre ella */
function animateLeg(id, speed = 1){
  return new Promise(res => {
    const vis = $('#rt-' + id), mk = $(`#mk-${id} path`), mv = $('#mv-' + id);
    const L = vis.getTotalLength();
    mk.style.strokeDasharray = L; mk.style.strokeDashoffset = L;
    vis.style.opacity = 1;
    if (REDUCED){ mk.style.strokeDashoffset = 0; return res(); }
    const dur = Math.min(3400, Math.max(1300, L * 6)) / speed;
    mv.style.opacity = 1;
    const t0 = performance.now();
    (function frame(t){
      const k = Math.min(1, (t - t0) / dur);
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      mk.style.strokeDashoffset = L * (1 - e);
      const p = vis.getPointAtLength(L * e);
      mv.setAttribute('transform', `translate(${p.x} ${p.y})`);
      if (k < 1) requestAnimationFrame(frame); else { mv.style.opacity = 0; res(); }
    })(t0);
  });
}
function resetRoutes(){
  $$('#worldMap .route').forEach(r => r.style.opacity = 0);
  $$('#worldMap .mover').forEach(m => m.style.opacity = 0);
}

      </div>

  const chips = $$('#m1chips .chip');

    const missing = d.items.filter(i => i.ok && !sel.has(i.id));
    const good = d.items.filter(i => i.ok && sel.has(i.id));
    chips.forEach(c => { const it = d.items.find(i => i.id === c.dataset.id); if (sel.has(it.id)) c.classList.add(it.ok ? 'good' : 'badc'); });

   ========================================================= */
function renderM2(){
  const d = P().m2;
  app.innerHTML = shell(2, '🗺️', '¿Por qué aquí y no allá?', d.lead) + `
    <p class="q-prompt">${d.prompt}</p>
    <p class="hint">No hay una sola respuesta correcta: lo importante es que tu elección tenga evidencia.</p>
    <div class="terr-grid">${d.territories.map(t => `
      <button class="terr t-${t.id}" type="button" data-t="${t.id}" aria-pressed="false">
        <div class="terr-top"><span class="terr-emoji" aria-hidden="true">${t.e}</span><span class="terr-code">Territorio ${t.code}</span><span class="terr-name">${t.name}</span></div>
        <ul>${t.traits.map(x => `<li>${x}</li>`).join('')}</ul>
      </button>`).join('')}
    </div>
    <div id="m2rest"></div>`;

  let tId = null, justified = false;
  const fac = new Set();

  $$('.terr').forEach(b => b.addEventListener('click', () => {
    tId = b.dataset.t;
    $$('.terr').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
    if (!$('#m2fcard')) buildFactors();
    else $('#m2name').textContent = d.territories.find(t => t.id === tId).name;
  }));

  function buildFactors(){
    const box = reveal(`<div class="card" id="m2fcard">
        <p class="q-prompt">Elegiste <span id="m2name">${d.territories.find(t => t.id === tId).name}</span>. Selecciona hasta 3 factores que influyeron en tu decisión:</p>
        <div class="chips" id="m2chips">${d.factors.map(f => `<button class="chip" type="button" data-f="${f.id}" aria-pressed="false"><span aria-hidden="true">${f.e}</span>${f.t}</button>`).join('')}</div>
        <div class="row"><button class="btn primary" id="m2go" type="button" disabled>Justificar mi decisión</button><span class="counter" id="m2count">0 de 3</span></div>
        <div id="m2fb"></div>
      </div><div id="m2end"></div>`, $('#m2rest'));

    $$('#m2chips .chip', box).forEach(c => c.addEventListener('click', () => {
      const f = c.dataset.f;
      if (fac.has(f)) fac.delete(f);
      else if (fac.size >= 3){ shake(c); $('#m2count').textContent = 'Máximo 3: quita uno primero'; return; }
      else fac.add(f);
      c.classList.toggle('on', fac.has(f)); c.setAttribute('aria-pressed', fac.has(f));
      $('#m2count').textContent = `${fac.size} de 3`;
      $('#m2go').disabled = fac.size === 0;
    }));
    $('#m2go').addEventListener('click', justify);
  }

  function justify(){
    const t = d.territories.find(x => x.id === tId);
    let supported = 0;
    const lines = [...fac].map(fid => {
      const f = d.factors.find(x => x.id === fid);
      if (t.has[fid]){ supported++; return `<li>✔ <b>${f.t}:</b> ${t.name} lo tiene: «${t.has[fid]}».</li>`; }
      if (t.lacks[fid]) return `<li>✖ <b>${f.t}:</b> aquí es una desventaja: «${t.lacks[fid]}».</li>`;
      return `<li>✖ <b>${f.t}:</b> la ficha de ${t.name} no lo menciona, así que sería una suposición sin evidencia.</li>`;
    });
    const type = supported === fac.size ? 'ok' : supported > 0 ? 'info' : 'bad';
    const head = supported === fac.size ? 'Tu decisión está bien fundamentada.' : supported > 0 ? 'Parte de tu argumento tiene evidencia.' : 'Tu elección necesita más evidencia.';
    fb($('#m2fb'), type, `<strong>${head}</strong><ul class="why">${lines.join('')}</ul><p>${t.insight}</p><p>Puedes cambiar de territorio o de factores y volver a justificar para comparar.</p>`);
    $('#m2go').textContent = 'Justificar de nuevo';

    S.answers.m2 = { name:t.name, factors:[...fac].map(id => d.factors.find(f => f.id === id).t) };
    if (!S.flags.m2scored){
      S.flags.m2scored = true;
      setScore('m2', t.weak ? 5 : Math.min(POINTS.m2, supported * 5));
    }
    if (!justified){
      justified = true;
      const end = $('#m2end');
      end.innerHTML = `<div class="card quote" style="margin-top:18px">
        <p class="big-quote">En Geografía Económica no basta con preguntar <b>DÓNDE</b> se produce. También debemos preguntar <b>POR QUÉ</b> ahí.</p>
        <p>${d.combo}</p></div>`;
      nextBtn(end, 'Continuar a la Misión 3 →', () => go('m3'));
    }
  }
}

/* =========================================================
   M. MISIÓN 3: ¿QUIÉN MUEVE EL CIRCUITO?
   Clasificación por arrastre (mouse y dedo) o por toque.
   ========================================================= */
function renderM3(){
  const d = P().m3;
  app.innerHTML = shell(3, '👥', '¿Quién mueve el circuito?', d.lead) + `
    <div class="grid-m3">
      <figure class="card illo">${SVG_FACTORY}</figure>
      <div class="card">
        <p class="q-prompt">${d.prompt}</p>
        <p class="hint">Arrastra cada tarjeta a <b>AGENTE</b> o <b>FACTOR</b>. También puedes tocar una tarjeta y después tocar la caja donde va.</p>
        <div id="m3fb" aria-live="polite"></div>
      </div>
    </div>
    <div class="card pool" id="pool">${shuffle(d.items).map(it =>
      `<button class="tag" type="button" data-id="${it.id}"><span aria-hidden="true">${it.e}</span>${it.t}</button>`).join('')}
    </div>
    <div class="zones">
      <div class="zone z-agente" data-z="agente" role="button" tabindex="0" aria-label="Colocar en Agente">
        <div class="zone-h"><b>🧑‍💼 AGENTE</b><small>¿Quién participa?</small></div><div class="zone-b"></div>
      </div>
      <div class="zone z-factor" data-z="factor" role="button" tabindex="0" aria-label="Colocar en Factor">
        <div class="zone-h"><b>⚙️ FACTOR</b><small>¿Qué condición lo permite?</small></div><div class="zone-b"></div>
      </div>
    </div>
    <div id="m3end"></div>`;

  const items = Object.fromEntries(d.items.map(i => [i.id, i]));
  let selected = null, drag = null, errors = 0, placed = 0;
  const zones = $$('.zone');
  const zoneAt = (x, y) => { const el = document.elementFromPoint(x, y); return el ? el.closest('.zone') : null; };

  function select(tag){
    if (selected === tag){ tag.classList.remove('selected'); selected = null; }
    else { if (selected) selected.classList.remove('selected'); selected = tag; tag.classList.add('selected'); }
    zones.forEach(z => z.classList.toggle('armed', !!selected));
  }
  function place(tag, z){
    const it = items[tag.dataset.id];
    tag.classList.remove('selected'); selected = null;
    zones.forEach(x => x.classList.remove('armed'));
    if (it.type === z){
      tag.disabled = true; tag.classList.add('placed');
      $(`.zone[data-z="${z}"] .zone-b`).appendChild(tag);
      placed++;
      fb($('#m3fb'), 'ok', `✔ <b>${it.t}</b> es ${z === 'agente' ? 'un agente' : 'un factor'}: ${it.why}`);
      if (placed === d.items.length) finish();
    } else {
      errors++;
      shake(tag);
      fb($('#m3fb'), 'bad', `<b>${it.t}</b> no va en ${z === 'agente' ? 'AGENTE' : 'FACTOR'}. Piénsalo así: ${it.why}`);
    }
  }

  $$('#pool .tag').forEach(tag => {
    tag.addEventListener('pointerdown', e => {
      if (tag.disabled) return;
      drag = { tag, x:e.clientX, y:e.clientY, ghost:null };
      tag.setPointerCapture(e.pointerId);
    });
    tag.addEventListener('pointermove', e => {
      if (!drag || drag.tag !== tag) return;
      if (!drag.ghost){
        if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
        drag.ghost = tag.cloneNode(true);
        drag.ghost.classList.add('ghost');
        drag.ghost.classList.remove('selected');
        document.body.appendChild(drag.ghost);
        tag.classList.add('lifting');
      }
      drag.ghost.style.left = e.clientX + 'px';
      drag.ghost.style.top = e.clientY + 'px';
      const z = zoneAt(e.clientX, e.clientY);
      zones.forEach(x => x.classList.toggle('hover', x === z));
    });
    const endDrag = e => {
      if (!drag || drag.tag !== tag) return;
      if (drag.ghost){
        drag.ghost.remove();
        tag.classList.remove('lifting');
        zones.forEach(x => x.classList.remove('hover'));
        tag._suppress = performance.now() + 400; // evita que el 'click' tras soltar seleccione esta misma tarjeta
        const z = e.type === 'pointerup' ? zoneAt(e.clientX, e.clientY) : null;
        if (z) place(tag, z.dataset.z);
      }
      drag = null;
    };
    tag.addEventListener('pointerup', endDrag);
    tag.addEventListener('pointercancel', endDrag);
    tag.addEventListener('click', () => {
      if (performance.now() < (tag._suppress || 0) || tag.disabled) return;
      select(tag);
    });
  });
  zones.forEach(z => {
    z.addEventListener('click', () => { if (selected) place(selected, z.dataset.z); });
    z.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && selected){ e.preventDefault(); place(selected, z.dataset.z); } });
  });

  function finish(){
    setScore('m3', Math.max(6, POINTS.m3 - 2 * errors));
    S.answers.m3 = { errors };
    const box = reveal(`<div class="card pista">
        <div class="pista-h">🔎 LO QUE DESCUBRISTE</div>
        <p class="pista-t">“${d.explain}”</p>
        <p>${d.example}</p>
      </div><div id="m3badge"></div>`, $('#m3end'));
    const end = $('#m3badge', box);
    giveBadge('agentes', end);
    nextBtn(end, 'Continuar a la Misión 4 →', () => go('m4'));
  }
}

/* =========================================================
   N. MISIÓN 4: ¿CÓMO SE MUEVE?
   ========================================================= */
function renderM4(){
  const d = P().m4;
  app.innerHTML = shell(4, '🚢', '¿Cómo se mueve?', d.lead) + `
    <div class="card map-card" id="mapCard">
      <div class="map-wrap">${buildMap(d, P().label)}</div>
      <p class="swipe-hint">↔ Desliza el mapa para verlo completo</p>
      <div class="chain" id="chain">${d.chain.map((c, i) => `<span class="ch" data-i="${i}">${c}</span>`).join('<span class="ch-arrow" aria-hidden="true">→</span>')}</div>
      <p class="route-cap" id="routeCap" aria-live="polite"></p>
      <div class="legend">${[['mar', '🚢 Marítimo'], ['tierra', '🚛 Terrestre'], ['aire', '✈️ Aéreo']]
        .filter(([m]) => Object.values(d.legs).some(l => l.mode === m))
        .map(([m, t]) => `<span><i class="lg-${m}"></i>${t}</span>`).join('')}</div>
      <p class="map-note">${d.note}</p>
    </div>
    <div class="card" id="m4order" style="margin-top:18px">
      <p class="q-prompt">Ordena las etapas del circuito: toca cada etapa en el orden en que ocurre.</p>
      <p class="hint">Si te equivocas, toca una casilla ocupada para devolver esa etapa.</p>
      <ol class="slots" id="slots">${d.stages.map((_, i) => `<li class="slot" data-n="${i}"><span class="s-n">${i + 1}</span><span class="s-t">Etapa ${i + 1}<span class="s-d">Vacía</span></span></li>`).join('')}</ol>
      <div class="chips" id="stagePool"></div>
      <div class="row"><button class="btn primary" id="m4check" type="button" disabled>Revisar el orden</button><button class="btn ghost" id="m4clear" type="button">Vaciar</button></div>
      <div id="m4fb"></div>
    </div>
    <div id="m4rest"></div>`;

  /* ----- Ordenar etapas ----- */
  let pool;
  do { pool = shuffle(d.stages); } while (pool.every((s, i) => s.id === d.stages[i].id));
  const seq = [];
  let tries = 0, solved = false;

  function drawOrder(){
    $('#stagePool').innerHTML = pool.filter(s => !seq.includes(s)).map(s =>
      `<button class="chip" type="button" data-id="${s.id}"><span aria-hidden="true">${s.e}</span>${s.t}</button>`).join('');
    $$('#slots .slot').forEach((slot, i) => {
      const s = seq[i];
      slot.classList.toggle('filled', !!s);
      slot.classList.remove('good', 'wrong');
      slot.querySelector('.s-t').innerHTML = s ? `${s.e} ${s.t}<span class="s-d">${s.d}</span>` : `Etapa ${i + 1}<span class="s-d">Vacía</span>`;
    });
    $('#m4check').disabled = seq.length !== d.stages.length;
    $$('#stagePool .chip').forEach(c => c.addEventListener('click', () => {
      if (solved) return;
      seq.push(d.stages.find(s => s.id === c.dataset.id));
      drawOrder();
    }));
  }
  $$('#slots .slot').forEach((slot, i) => slot.addEventListener('click', () => {
    if (solved || !seq[i]) return;
    seq.splice(i, 1);
    drawOrder();
  }));
  $('#m4clear').addEventListener('click', () => { if (!solved){ seq.length = 0; drawOrder(); } });
  $('#m4check').addEventListener('click', () => {
    const ok = seq.map((s, i) => s.id === d.stages[i].id);
    const nOk = ok.filter(Boolean).length;
    $$('#slots .slot').forEach((slot, i) => { slot.classList.add(ok[i] ? 'good' : 'wrong'); });
    if (nOk === d.stages.length){
      solved = true;
      award('m4a', tries);
      $$('#slots .slot').forEach(s => s.classList.add('locked'));
      $('#stagePool').remove();
      $('#m4check').parentElement.remove();
      $('#worldMap').classList.add('ordered');
      fb($('#m4fb'), 'ok', `<strong>¡Circuito reconstruido!</strong> ${d.solved} Ahora mira en el mapa <b>dónde</b> ocurre cada etapa.`);
      m4Route(d);
      return;
    }
    tries++;
    const first = ok.findIndex(v => !v);
    fb($('#m4fb'), 'bad', `<strong>${nOk} de ${d.stages.length} etapas están en su lugar.</strong> Pista para la etapa ${first + 1}: ${d.stages[first].hint} Toca las casillas en rojo para devolverlas.`);
  });
  drawOrder();
}

  const m2 = S.answers.m2;
  app.innerHTML = shell(5, '🌎', 'La radiografía del circuito', d.lead) + `
    <div class="xray">
      <div class="xray-h"><h3>${d.title}</h3></div>
      <div class="xray-body">${d.fields.map(f => `
        <div class="rx-field" data-f="${f.id}">
          <div class="rx-top"><h4><span aria-hidden="true">${f.e}</span> ${f.t}:</h4><span class="rx-val" id="rxv-${f.id}"></span></div>
          ${f.note ? `<p class="rx-note">${f.note}</p>` : ''}
          ${f.id === 'territorio' && m2 ? `<p class="rx-note">En la Misión 2 elegiste ${m2.name}; aquí elige un territorio real de la ruta.</p>` : ''}
          <div class="chips">${f.opts.map((o, i) => `<button class="chip small" type="button" data-i="${i}">${o.t}</button>`).join('')}</div>
          <div class="rx-fb" role="status"></div>
        </div>`).join('')}
      </div>
    </div>
    <div id="m5rest"></div>`;

  const clean = {}; /* campos resueltos sin error */
  const filled = {};
  let finished = false;

  $$('.rx-field').forEach(field => {
    const f = d.fields.find(x => x.id === field.dataset.f);
    clean[f.id] = true;
    const fbx = $('.rx-fb', field);
    $$('.chip', field).forEach(c => c.addEventListener('click', () => {
      const o = f.opts[+c.dataset.i];
      if (o.ok){
        $$('.chip', field).forEach(x => x.classList.remove('good'));
        c.classList.add('good');
        const v = $('#rxv-' + f.id);
        v.textContent = o.t; v.classList.add('filled');
        fbx.textContent = ''; fbx.className = 'rx-fb';
        S.answers.rx[f.id] = o.t;
        filled[f.id] = true;
        checkDone();
      } else {
        clean[f.id] = false;
        c.classList.add('badc'); c.disabled = true; shake(c);
        fbx.className = 'rx-fb bad';
        fbx.textContent = '✖ ' + o.why;
      }
    }));
  });

  function checkDone(){
    if (finished || Object.keys(filled).length < d.fields.length) return;
    finished = true;
    const n = Object.values(clean).filter(Boolean).length;
    setScore('m5a', Math.round(POINTS.m5a * n / d.fields.length));
    const box = reveal(`<div class="card">
        <p class="q-prompt">✍️ Resume el circuito con tus palabras (opcional)</p>
        <p class="hint">Por ejemplo: qué recurso te sorprendió, qué territorio no esperabas o qué conecta todo.</p>
        <label class="sr" for="m5text">Resumen con tus palabras</label>
        <textarea id="m5text" placeholder="${d.placeholder}"></textarea>
      </div>
      <blockquote class="card quote" style="margin:18px 0 0"><p class="big-quote">“${d.qFinal.prompt}”</p></blockquote>
      <div id="m5q"></div><div id="m5end"></div>`, $('#m5rest'));
    $('#m5text').addEventListener('input', e => { S.answers.m5text = e.target.value.trim(); });
    mcq($('#m5q', box), d.qFinal, () => {
      nextBtn($('#m5end', box), 'Terminar la misión 🎉', () => go('final'));
    });
  }
}

/* =========================================================
   P. PANTALLA FINAL
   ========================================================= */
function category(score){
  if (score >= 90) return { e:'🌎', t:'EXPLORADOR GLOBAL' };
  if (score >= 70) return { e:'🗺️', t:'DETECTIVE TERRITORIAL' };
  if (score >= 50) return { e:'🔎', t:'INVESTIGADOR EN FORMACIÓN' };
  return { e:'🧭', t:'SIGUE EXPLORANDO' };
}
function renderFinal(){
  const d = P(), rx = S.answers.rx, m2 = S.answers.m2;
  const score = total(), cat = category(score);
  app.innerHTML = `
    <section class="final-hero">
      <h2>🎉 ¡MISIÓN COMPLETADA!</h2>
      <p>Acabas de seguir la ruta de un producto a través del territorio.</p>
    </section>
    <div class="stack">
      <div class="card score-wrap">
        <div class="ring" id="ring" style="--p:0"><div class="ring-in"><div><b id="scoreNum">0</b><br><small>de 100</small></div></div></div>
        <div>
          <p class="cat">${cat.e} ${cat.t}</p>
          <p class="cat-note">Este número solo muestra cuánto avanzaste dentro de la misión y cuántos intentos usaste. No es una calificación ni mide tu capacidad: es el nombre divertido de tu etapa como explorador o exploradora.</p>
        </div>
      </div>
      <div class="summary">
        <div class="sum"><span class="s-e">🌱</span><b>Factor natural identificado</b><p>${rx.natural || '—'}</p></div>
        <div class="sum"><span class="s-e">👥</span><b>Agente identificado</b><p>${rx.agente || '—'}</p></div>
        <div class="sum"><span class="s-e">🏭</span><b>Factor socioeconómico identificado</b><p>${rx.socio || '—'}</p></div>
        <div class="sum"><span class="s-e">🗺️</span><b>Territorios involucrados</b><p>${d.summary.territorios}${m2 ? `. Además, analizaste ${m2.name}.` : ''}</p></div>
        <div class="sum"><span class="s-e">🚢</span><b>Transporte</b><p>${d.summary.transporte}</p></div>
        <div class="sum"><span class="s-e">🌎</span><b>Escala global</b><p>${d.summary.escala}</p></div>
      </div>
      <div class="card">
        <p class="q-prompt" style="margin-top:0">Insignias obtenidas</p>
        <div class="badges" style="margin-top:10px">${S.badges.map(k => `<span class="bdg">${BADGES[k].e} ${BADGES[k].t}</span>`).join('') || '<span>—</span>'}</div>
      </div>
      <div class="card think">
        <h3>💭 PIENSA COMO GEÓGRAFO</h3>
        <p>Cuando vuelvas a mirar un producto en una tienda, pregúntate:</p>
        <ul>
          <li>🌱 ¿De dónde vienen sus recursos?</li>
          <li>👥 ¿Quiénes participan?</li>
          <li>📍 ¿Por qué se produce ahí?</li>
          <li>🗺️ ¿Qué territorios conecta?</li>
          <li>🚢 ¿Cómo llegó hasta mí?</li>
        </ul>
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn primary big" id="seeRx" type="button">📊 Ver mi radiografía</button>
        <button class="btn ghost big" id="again" type="button">🔄 Reiniciar misión</button>
      </div>
    </div>`;

  $('#seeRx').addEventListener('click', openRadiografia);
  $('#again').addEventListener('click', restart);

  /* Contador animado del puntaje */
  const ring = $('#ring'), num = $('#scoreNum');
  if (REDUCED){ ring.style.setProperty('--p', score); num.textContent = score; }
  else {
    const t0 = performance.now();
    (function tick(t){
      const k = Math.min(1, (t - t0) / 1400), v = Math.round(score * (1 - Math.pow(1 - k, 3)));
      ring.style.setProperty('--p', v); num.textContent = v;
      if (k < 1) requestAnimationFrame(tick);
    })(t0);
    confetti();
  }
}
function confetti(){
  const c = document.createElement('div');
  c.className = 'confetti';
  const colors = ['#8E7CF0', '#F29BC0', '#5FA8F5', '#FFD35C', '#fff'];
  for (let i = 0; i < 44; i++){
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + 'vw';
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (Math.random() * .8) + 's';
    s.style.animationDuration = (2.4 + Math.random() * 1.4) + 's';
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 4500);
}

/* =========================================================
   Q. MODAL: VER MI RADIOGRAFÍA
   ========================================================= */
function openRadiografia(){
  const d = P(), rx = S.answers.rx, m2 = S.answers.m2;
  const modal = $('#modal');
  const rows = d.m5.fields.map(f => `<div class="rx-row"><span class="rx-e">${f.e}</span><div><b>${f.t}</b><p>${rx[f.id] || '—'}</p></div></div>`).join('');
  modal.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rxTitle">
    <button class="x" type="button" aria-label="Cerrar">✕</button>
    <h2 id="rxTitle">📋 Radiografía territorial de ${d.label}</h2>
    ${rows}
    ${m2 ? `<div class="rx-row"><span class="rx-e">🗺️</span><div><b>Mi decisión de localización</b><p>${m2.name}, por: ${m2.factors.join(', ').toLowerCase()}</p></div></div>` : ''}
    <div class="rx-row"><span class="rx-e">🌎</span><div><b>¿Por qué es un circuito productivo global?</b><p>${S.answers.m5b || '—'}</p></div></div>
    ${S.answers.m5text ? `<div class="rx-row"><span class="rx-e">✍️</span><div><b>Con mis palabras</b><p>${escapeHTML(S.answers.m5text)}</p></div></div>` : ''}
    <p class="hint" style="margin-top:12px">Progreso en la misión: ${total()} de 100</p>
    <div class="row"><button class="btn ghost" id="printRx" type="button">🖨️ Imprimir</button><button class="btn primary" id="closeRx" type="button">Cerrar</button></div>
  </div>`;
  modal.classList.add('open');
  const close = () => { modal.classList.remove('open'); modal.innerHTML = ''; $('#seeRx') && $('#seeRx').focus(); };
  $('.x', modal).addEventListener('click', close);
  $('#closeRx').addEventListener('click', close);
  $('#printRx').addEventListener('click', () => window.print());
  modal.onclick = e => { if (e.target === modal) close(); };
  $('#closeRx').focus();
}
function escapeHTML(s){ return s.replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').classList.contains('open')) $('#modal .x').click();
});

/* =========================================================
   R. INICIO
   ========================================================= */
go('home');
</script>
</body>
